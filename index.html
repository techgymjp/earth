<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>国探し｜リアルな地球を回して国を見つけるゲーム</title>
  <meta name="description" content="リアルな地球をくるくる回して、お題の国を見つけるWebゲーム。全10問のタイムアタック。かんたん・ふつう・むずかしいの3段階。">
  <link rel="canonical" href="https://techgymjp.github.io/earth/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="国探し">
  <meta property="og:title" content="国探し｜リアルな地球を回して国を見つけるゲーム">
  <meta property="og:description" content="リアルな地球をくるくる回して、お題の国を見つけるWebゲーム。全10問のタイムアタック。かんたん・ふつう・むずかしいの3段階。">
  <meta property="og:url" content="https://techgymjp.github.io/earth/">
  <meta property="og:image" content="https://techgymjp.github.io/earth/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="国探し - リアルな地球をくるくる回してお題の国を見つけよう">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="国探し｜リアルな地球を回して国を見つけるゲーム">
  <meta name="twitter:description" content="リアルな地球をくるくる回して、お題の国を見つけるWebゲーム。全10問のタイムアタック。">
  <meta name="twitter:image" content="https://techgymjp.github.io/earth/ogp.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌏</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="globe"></div>

  <!-- タイトル画面 -->
  <section id="title-screen" class="overlay">
    <div class="panel">
      <div class="lang-switch" id="lang-switch">
        <button data-lang="ja">日本語</button>
        <button data-lang="en">English</button>
      </div>
      <h1 data-i18n="title">国探し</h1>
      <p class="lead" data-i18n="lead">地球をくるくる回して、お題の国を見つけよう！<br>全10問・タイムも計測します</p>

      <h2 data-i18n="difficulty">難易度</h2>
      <div class="choices" id="difficulty">
        <button data-value="easy" class="choice selected">
          <strong data-i18n="easy">かんたん</strong><span data-i18n="easyDesc">国境線あり・有名な国</span>
        </button>
        <button data-value="normal" class="choice">
          <strong data-i18n="normal">ふつう</strong><span data-i18n="normalDesc">国境線なし・有名な国〜中くらいの国</span>
        </button>
        <button data-value="hard" class="choice">
          <strong data-i18n="hard">むずかしい</strong><span data-i18n="hardDesc">国境線なし・マニアックな国</span>
        </button>
      </div>

      <h2 data-i18n="region">地域</h2>
      <div class="choices small" id="region">
        <button data-value="all" class="choice selected" data-i18n="all">全世界</button>
        <button data-value="asia" class="choice" data-i18n="asia">アジア</button>
        <button data-value="europe" class="choice" data-i18n="europe">ヨーロッパ</button>
        <button data-value="africa" class="choice" data-i18n="africa">アフリカ</button>
        <button data-value="namerica" class="choice" data-i18n="namerica">北アメリカ</button>
        <button data-value="samerica" class="choice" data-i18n="samerica">南アメリカ</button>
        <button data-value="oceania" class="choice" data-i18n="oceania">オセアニア</button>
      </div>

      <button id="start-btn" class="primary" data-i18n="start">スタート</button>
      <p class="howto" data-i18n="howto">ドラッグで回転・ホイール/ピンチで拡大縮小・国をクリック/タップで回答</p>
      <div class="legal">
        <span id="build-info"></span>
        <a id="privacy-link" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-i18n="privacy">プライバシーポリシー</a>
        <span id="ad-privacy" hidden>｜<a href="#" id="ad-privacy-link" data-i18n="adSettings">広告の設定</a></span>
      </div>
      <div id="loading" class="loading">
        <div class="load-track"><i id="load-bar"></i></div>
        <span data-i18n="loading">地球を読み込み中…</span>
      </div>
    </div>
  </section>

  <!-- プレイ中の表示 -->
  <section id="hud" hidden>
    <div class="top">
      <div class="meta">
        <span id="q-num">Q1/10</span>
        <span id="timer">⏱ 0.0秒</span>
        <span id="score">0点</span>
      </div>
      <div class="question" id="question"></div>
      <div id="hint-text" class="hint-text"></div>
      <div id="lives" class="lives"></div>
    </div>
    <div class="bottom">
      <button id="hint-btn" class="sub" data-i18n="hint">ヒント</button>
      <button id="skip-btn" class="sub" data-i18n="skip">パス</button>
      <button id="pause-btn" class="sub ghost" data-i18n="pause">一時停止</button>
    </div>
    <button id="next-btn" class="primary next" hidden>次の問題へ</button>

    <!-- リワード広告でハートを回復 (アプリのみ) -->
    <div id="revive" class="revive" hidden>
      <p id="revive-title" class="revive-title"></p>
      <p id="revive-note" class="revive-note"></p>
      <button id="revive-watch" class="primary"></button>
      <button id="revive-skip" class="sub ghost"></button>
    </div>
  </section>

  <!-- 一時停止 (地球は隠して、止めている間に探せないようにする) -->
  <section id="pause-screen" class="overlay pause" hidden>
    <div class="panel">
      <h1 data-i18n="paused">一時停止中</h1>
      <div class="row">
        <button id="resume-btn" class="primary" data-i18n="resume">再開</button>
        <button id="quit-btn" class="sub" data-i18n="menu">タイトルへ</button>
      </div>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result-screen" class="overlay" hidden>
    <div class="panel">
      <h1 data-i18n="result">結果</h1>
      <div class="total" id="final-score">0</div>
      <div class="stats">
        <div><small data-i18n="correctCount">正解</small><b id="final-correct">0/10</b></div>
        <div><small data-i18n="totalTime">合計タイム</small><b id="final-time">0.0秒</b></div>
      </div>
      <p id="final-revives" class="howto" hidden></p>
      <p id="final-comment" class="lead"></p>
      <p id="best-score" class="howto"></p>
      <ol id="result-list" class="result-list"></ol>
      <div class="row share-row">
        <button id="share-btn" class="sub" data-i18n="share">シェア</button>
        <button id="x-btn" class="sub" data-i18n="postX">𝕏 でポスト</button>
      </div>
      <div class="row">
        <button id="retry-btn" class="primary" data-i18n="retry">もう一度</button>
        <button id="menu-btn" class="sub" data-i18n="menu">タイトルへ</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
  <button id="sound-btn" class="sound-btn" aria-label="サウンドのオン/オフ">🔊</button>

  <script src="ads-config.js"></script>
  <script src="build-info.js"></script>
  <script src="ads.js"></script>
  <script src="vendor/globe.gl.min.js"></script>
  <script src="data/countries.js"></script>
  <script src="game.js"></script>
</body>
</html>
